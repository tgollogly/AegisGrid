name: CI

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: CLI smoke
        run: |
          python -m cli --root /tmp/aegis-smoke init
          python -m cli --root /tmp/aegis-smoke temperature set --value 4.0
          python -m cli --root /tmp/aegis-smoke status
