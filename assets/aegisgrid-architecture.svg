<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">AegisGrid architecture</title>
  <desc id="archDesc">Local zero-trust boundary with CLI, core, watchdog, DuckDB, manifest, and network guard</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#020617"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">AegisGrid - local trust boundary</text>
  <text x="480" y="62" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Integrity failure -&gt; network fails closed (new sockets blocked)</text>

  <rect x="40" y="88" width="880" height="520" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="56" y="112" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" font-weight="600">ZERO-TRUST LOCAL BOUNDARY</text>

  <g font-family="system-ui,sans-serif" font-size="14" fill="#f8fafc">
    <rect x="80" y="160" width="160" height="52" rx="8" fill="url(#panel)" stroke="#475569"/>
    <text x="160" y="192" text-anchor="middle">Operator / CLI</text>

    <rect x="320" y="140" width="200" height="72" rx="8" fill="url(#panel)" stroke="#14b8a6" stroke-width="2"/>
    <text x="420" y="172" text-anchor="middle" font-weight="700">AegisGrid core</text>
    <text x="420" y="192" text-anchor="middle" fill="#99f6e4" font-size="12">core.py / cli.py</text>

    <rect x="600" y="160" width="200" height="52" rx="8" fill="url(#panel)" stroke="#475569"/>
    <text x="700" y="192" text-anchor="middle">Hardware watchdog</text>

    <rect x="120" y="300" width="220" height="56" rx="8" fill="url(#panel)" stroke="#475569"/>
    <text x="230" y="324" text-anchor="middle">DuckDB</text>
    <text x="230" y="344" text-anchor="middle" fill="#94a3b8" font-size="12">aegis_local.duckdb</text>

    <rect x="370" y="300" width="220" height="56" rx="8" fill="url(#panel)" stroke="#475569"/>
    <text x="480" y="324" text-anchor="middle">Signed manifest</text>
    <text x="480" y="344" text-anchor="middle" fill="#94a3b8" font-size="12">.aegis_backup/</text>

    <rect x="620" y="300" width="200" height="56" rx="8" fill="url(#panel)" stroke="#f87171"/>
    <text x="720" y="332" text-anchor="middle">Network guard</text>

    <rect x="600" y="420" width="220" height="52" rx="8" fill="url(#panel)" stroke="#64748b"/>
    <text x="710" y="452" text-anchor="middle" fill="#cbd5e1">Socket creation</text>

    <rect x="600" y="520" width="220" height="52" rx="8" fill="url(#panel)" stroke="#475569"/>
    <text x="710" y="544" text-anchor="middle">Compressor safe default</text>
    <text x="710" y="562" text-anchor="middle" fill="#94a3b8" font-size="11">1-8 C clamp</text>
  </g>

  <path d="M240 186 L318 176" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="268" y="168" fill="#64748b" font-size="11">SHA-256 token</text>

  <path d="M520 176 L598 186" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 212 L420 298" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 212 L480 298" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 356 L680 356" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="548" y="348" fill="#f87171" font-size="11">tamper</text>
  <path d="M720 356 L720 418" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="732" y="392" fill="#f87171" font-size="11">blocks</text>
  <path d="M700 212 L710 418" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="668" y="300" fill="#64748b" font-size="11">1-8 C</text>

  <rect x="80" y="420" width="420" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="448" fill="#e2e8f0" font-size="14" font-weight="600">DuckDB tables</text>
  <text x="100" y="478" fill="#94a3b8" font-size="13">access_control, threat_cache</text>
  <text x="100" y="502" fill="#94a3b8" font-size="13">hardware_state, system_audit</text>
</svg>
