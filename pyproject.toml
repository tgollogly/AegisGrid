[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisgrid"
version = "1.0.0"
description = "Free local IoT refrigeration gateway security — voluntary MIT reference for cold-chain audit and defence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tgollogly" }]
dependencies = [
    "duckdb>=1.1.0,<3.0.0",
]

[tool.setuptools]
py-modules = ["core", "cli"]

[project.scripts]
aegisgrid = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
