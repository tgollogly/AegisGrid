[project]
name = "aegisgrid"
version = "1.0.0"
description = "Local IoT refrigeration control, security, and audit platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tgollogly" }]
dependencies = [
    "duckdb>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
